[build-system]
requires = ["uv_build >= 0.10.10, <0.12.0"]
build-backend = "uv_build"

[project]
name = "moltensaltcalc"
version = "0.1.5"
description = "Molten salt simulation package employing universal machine-learned interatomic potentials (uMLIPs)"
readme = "README.md"
requires-python = ">=3.11"
dynamic = []

authors = [
    { name = "Daniel Isler", email = "isler@differ.nl"},
    { name = "Lei Zhang" },
    { name = "Max van Brenk" },
    { name = "Suleyman Er", email = "s.er@differ.nl"},
]

license = "MIT"
license-files = ["LICEN[CS]E*"]

keywords = ["molecular dynamics", "ML potentials", "ASE", "materials science", "atomistic simulation", "interatomic potentials", "machine learning interatomic potentials"]

classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "Intended Audience :: Science/Research",
    "Development Status :: 3 - Alpha",
]

# Core dependencies
dependencies = [
    "ase>=3.27,<4.0",
    "numpy>=1.26,<3.0",
    "scipy>=1.10,<2.0",
    "myplots>=0.1.3",
    "tqdm",
]

# Optional dependencies (for MLIPs)
[project.optional-dependencies]

# By default with the DFTD3 dispersion calculator
grace = ["tensorpotential","torch","torch-dftd"]
fairchem = ["fairchem-core>=2.3,<3.0","torch","torch-dftd"]
mace = ["mace-torch","cuequivariance","cuequivariance-torch","torch","torch-dftd"]
mattersim = ["mattersim","torch","torch-dftd"]
7net = ["sevenn","torch","torch-dftd"]
nequip = ["nequip","torch","torch-dftd"]
nequix = ["nequix","torch==2.9.1","torch-dftd"]
upet = ["upet","torch","torch-dftd"]
chgnet = ["chgnet","torch","torch-dftd"]
equiformer_v3 = ["equiformer-v3>=0.0.2","torch==2.4.1","torch-dftd"]
orbitals = ["orb-models","torch","torch-dftd"]
tace = ["tace","torch","torch-dftd"]
equflash = ["equflash>=0.0.2; sys_platform == 'linux' and python_version >= '3.12'","torch-dftd"]
matgl = ["matgl[jax]>=3.0.0","torch","torch-dftd"]
matris = ["matris>=0.0.1","torch","torch-dftd"]
deepmd = ["deepmd-kit[torch]>=3.2.0b0","torch","torch-dftd","huggingface_hub","requests"]
alphanet = ["msc-alphanet>=0.1.3","torch==2.9.1","torch-dftd","requests"]
eqnorm = ["eqnorm>=0.1.1","torch==2.9.1","torch-dftd"]
hienet = ["hienet","torch==2.9.1","torch-dftd"]
equiformer_v2 = ["equiformer-v2","torch","torch-dftd","huggingface_hub"]

# DFTD4 variants
dftd4 = ["dftd4"]

# No dispersion variants
grace-nodisp = ["tensorpotential",]
fairchem-nodisp = ["fairchem-core>=2.3,<3.0"]
mace-nodisp = ["mace-torch","cuequivariance","cuequivariance-torch"]
mattersim-nodisp = ["mattersim"]
7net-nodisp = ["sevenn"]
nequip-nodisp = ["nequip"]
nequix-nodisp = ["nequix","torch==2.9.1"]
upet-nodisp = ["upet"]
chgnet-nodisp = ["chgnet"]
equiformer_v3-nodisp = ["equiformer-v3>=0.0.2","torch==2.4.1"]
orbitals-nodisp = ["orb-models"]
tace-nodisp = ["tace"]
equflash-nodisp = ["equflash>=0.0.2; sys_platform == 'linux' and python_version >= '3.12'"]
matgl-nodisp = ["matgl[jax]>=3.0.0"]
matris-nodisp = ["matris"]
deepmd-nodisp = ["deepmd-kit[torch]>=3.2.0b0","huggingface_hub","requests"]
alphanet-nodisp = ["msc-alphanet>=0.1.3","torch==2.9.1","requests"]
eqnorm-nodisp = ["eqnorm>=0.1.1","torch==2.9.1"]
hienet-nodisp = ["hienet","torch==2.9.1"]
equiformer_v2-nodisp = ["equiformer-v2","huggingface_hub"]

dev = [
    "nox",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "coverage-badge",
    "uv",
    ]

docs = [
    "mkdocs-material",
    "mkdocstrings[python]",
    "black",
]

# Discoverability
[project.urls]
Documentation = "https://moltensaltcalc.readthedocs.io/en/latest/"
Repository = "https://github.com/leiapple/MoltenSaltCalc/"
Homepage = "https://github.com/leiapple/MoltenSaltCalc/"
Issues = "https://github.com/leiapple/MoltenSaltCalc/issues"

# UV sync (for CI)
[tool.uv]
conflicts = [
    [
        # Default (DFTD3) Variants
        { extra = "grace" },
        { extra = "fairchem" },
        { extra = "mace" },
        { extra = "mattersim" },
        { extra = "7net" },
        { extra = "nequip" },
        { extra = "nequix" },
        { extra = "upet" },
        { extra = "chgnet" },
        { extra = "equiformer_v3" },
        { extra = "orbitals" },
        { extra = "tace" },
        { extra = "equflash" },
        { extra = "matgl" },
        { extra = "matris" },
        { extra = "deepmd" },
        { extra = "alphanet" },
        { extra = "eqnorm" },
        { extra = "hienet" },
        { extra = "equiformer_v2" },

        # No Dispersion Variants
        { extra = "grace-nodisp" },
        { extra = "fairchem-nodisp" },
        { extra = "mace-nodisp" },
        { extra = "mattersim-nodisp" },
        { extra = "7net-nodisp" },
        { extra = "nequip-nodisp" },
        { extra = "nequix-nodisp" },
        { extra = "upet-nodisp" },
        { extra = "chgnet-nodisp" },
        { extra = "equiformer_v3-nodisp" },
        { extra = "orbitals-nodisp" },
        { extra = "tace-nodisp" },
        { extra = "equflash-nodisp" },
        { extra = "matgl-nodisp" },
        { extra = "matris-nodisp" },
        { extra = "deepmd-nodisp" },
        { extra = "alphanet-nodisp" },
        { extra = "eqnorm-nodisp" },
        { extra = "hienet-nodisp" },
        { extra = "equiformer_v2-nodisp" },
    ]
]

# For EquFlash
index-strategy = "unsafe-best-match"
find-links = ["https://data.pyg.org/whl/torch-2.4.1+cu121.html","https://data.pyg.org/whl/torch-2.9.1+cu126.html"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"

# UV build
[tool.uv_build]
include = ["moltensaltcalc/**/*.pyi", "moltensaltcalc/py.typed"]

# Pytest config
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "umlip: marks tests as requiring a uMLIP backend to be installed (run with 'nox -s' or 'nox -s \"umlip(model='model_name')\"'). These tests are skipped by default as they require different environments.",
]
pythonpath = [
  "src"
]

# Ruff config
[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes (unused imports, undefined names)
    "I",   # import sorting
    "B",   # flake8-bugbear (real bug risks)
    "UP",  # pyupgrade (modern Python)
    "SIM", # simplify code
    "C4",  # comprehensions
    "PIE", # misc useful improvements
]
ignore = ["E501"]
fixable = ["ALL"]

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"
indent-style = "space"

# Pylint config
[tool.pylint.MAIN]
ignore-paths = [
    "^docs/scripts/*",
]

[tool.pylint.FORMAT]
max-line-length = 500

[tool.pylint.BASIC]
good-names = [
    "i",
    "j",
    "k",
    "T",
    "U",
    "V",
    "D",
    "Ea",
    "D0",
    "C",
    "var_U",
    "7net",
    "test_uMLIPs",
]

[tool.pylint."MESSAGES CONTROL"]
disable = ["import-outside-toplevel"]

[tool.pylint.DESIGN]
max-attributes = 9
max-positional-arguments = 20
max-args = 20
max-branches = 20
max-locals = 35
max-statements = 51

[tool.pylint.TYPECHECK]
ignored-modules = [
    "moltensaltcalc",
    "numpy",
    "ase",
    "scipy",
    "pytest",
    "nox",
    "mace",
    "chgnet",
    "nequip",
    "nequix",
    "mattersim",
    "fairchem",
    "sevenn",
    "tensorpotential",
    "upet",
    "torch",
    "torch_dftd",
    "dftd4",
    "equiformer_v3",
    "huggingface_hub",
    "requests",
    "tqdm",
    "GGNN",
    "orb_models",
    "tace",
    "matgl",
    "matris",
    "deepmd",
    "alphanet",
    "eqnorm",
    "hienet",
    "equiformer_v2",
]
generated-members = ["GRACEModels.*"]
