name: CI pre-merge

on:
  push:
    branches: [main]
    paths-ignore:
      - "badges/coverage.svg"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run pre-commit
        run: uv run pre-commit run --all-files


  test:
    name: Pytest + coverage
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12.13"
          enable-cache: true

      - name: Cache uv package store
        uses: actions/cache@v4
        with:
          path: /home/runner/work/_temp/setup-uv-cache
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Install dependencies
        run: uv sync --extra dev --extra mace --extra dftd4

      - name: Set mace cache directory
        run: |
          echo "XDG_CACHE_HOME=$HOME/.cache" >> $GITHUB_ENV

      - name: Cache ML dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache
          key: cache-${{ runner.os }}-ml-v1
          restore-keys: |
            cache-${{ runner.os }}-ml-

      - name: Run tests
        run: uv run pytest --cov=./ --cov-report=xml --cov-report=term-missing

      - name: Generate coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: uv run python docs/scripts/update_coverage_badge.py coverage.xml badges/coverage.svg

      - name: Commit coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add badges/coverage.svg
          git diff --quiet && exit 0
          git commit -m "Update coverage badge [skip ci]"
          git pull --rebase --autostash
          git push

  nox-test:
    name: uMLIPs integration tests with nox
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ensure HuggingFace cache dir is cached
        run: |
          echo "HF_HOME=$HOME/.cache/huggingface" >> $GITHUB_ENV
          echo "HF_HUB_CACHE=$HOME/.cache/huggingface/hub" >> $GITHUB_ENV

      - name: Cache uv package store
        uses: actions/cache@v4
        with:
          path: /home/runner/work/_temp/setup-uv-cache
          key: uv-nox-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Run nox
        run: uv run nox -s umlip
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
